<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker - Standalone</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: 'SF Pro Text', Helvetica, Arial, sans-serif;
        }
    </style>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createElement: h } = React;

        // Finance Tracker Component (simplified inline version)
        const FinanceTracker = () => {
            const [transactions, setTransactions] = useState([]);
            const [summary, setSummary] = useState({
                totalIncome: 0,
                totalExpenses: 0,
                balance: 0,
                transactionCount: 0
            });
            const [formData, setFormData] = useState({
                type: 'income',
                amount: 0,
                description: ''
            });
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);

            const API_BASE_URL = 'https://vscode-internal-22879-beta.beta01.cloud.kavia.ai:3001';

            // Fetch all transactions
            const fetchTransactions = async () => {
                try {
                    setLoading(true);
                    const response = await axios.get(`${API_BASE_URL}/transactions`);
                    if (response.data.status === 'success') {
                        setTransactions(response.data.data);
                    }
                } catch (err) {
                    setError('Failed to fetch transactions');
                    console.error('Error fetching transactions:', err);
                } finally {
                    setLoading(false);
                }
            };

            // Fetch balance summary
            const fetchSummary = async () => {
                try {
                    const response = await axios.get(`${API_BASE_URL}/summary`);
                    if (response.data.status === 'success') {
                        setSummary(response.data.data);
                    }
                } catch (err) {
                    setError('Failed to fetch summary');
                    console.error('Error fetching summary:', err);
                }
            };

            // Add new transaction
            const addTransaction = async (e) => {
                e.preventDefault();
                if (!formData.description || formData.amount <= 0) {
                    setError('Please fill in all fields with valid values');
                    return;
                }

                try {
                    setLoading(true);
                    const response = await axios.post(`${API_BASE_URL}/transactions`, formData);
                    if (response.data.status === 'success') {
                        setFormData({ type: 'income', amount: 0, description: '' });
                        await fetchTransactions();
                        await fetchSummary();
                        setError(null);
                    }
                } catch (err) {
                    setError('Failed to add transaction');
                    console.error('Error adding transaction:', err);
                } finally {
                    setLoading(false);
                }
            };

            // Delete transaction
            const deleteTransaction = async (id) => {
                try {
                    setLoading(true);
                    const response = await axios.delete(`${API_BASE_URL}/transactions/${id}`);
                    if (response.data.status === 'success') {
                        await fetchTransactions();
                        await fetchSummary();
                    }
                } catch (err) {
                    setError('Failed to delete transaction');
                    console.error('Error deleting transaction:', err);
                } finally {
                    setLoading(false);
                }
            };

            // Load data on component mount
            useEffect(() => {
                fetchTransactions();
                fetchSummary();
            }, []);

            const containerStyle = {
                maxWidth: '1200px',
                margin: '0 auto',
                padding: '20px',
                fontFamily: 'SF Pro Text, Helvetica, Arial, sans-serif',
                backgroundColor: '#1a1a1a',
                color: '#ffffff',
                minHeight: '100vh'
            };

            const headerStyle = {
                textAlign: 'center',
                marginBottom: '30px',
                color: '#356aff'
            };

            const cardStyle = {
                backgroundColor: '#2d2d2d',
                borderRadius: '12px',
                padding: '20px',
                marginBottom: '20px',
                boxShadow: '0 4px 12px rgba(0, 0, 0, 0.3)'
            };

            const incomeColor = '#43d673';
            const expenseColor = '#ff7b54';

            return h('div', { style: containerStyle },
                h('h1', { style: headerStyle }, 'Finance Tracker'),
                
                error && h('div', {
                    style: {
                        ...cardStyle,
                        backgroundColor: '#ff4444',
                        color: 'white',
                        marginBottom: '20px'
                    }
                }, error),

                // Add Transaction Form
                h('div', { style: cardStyle },
                    h('h2', { style: { marginBottom: '20px', color: '#356aff' } }, 'Add Transaction'),
                    h('form', {
                        onSubmit: addTransaction,
                        style: {
                            display: 'grid',
                            gridTemplateColumns: 'auto auto 1fr auto',
                            gap: '15px',
                            alignItems: 'center',
                            marginBottom: '20px'
                        }
                    },
                        h('select', {
                            value: formData.type,
                            onChange: (e) => setFormData({ ...formData, type: e.target.value }),
                            style: {
                                padding: '12px',
                                borderRadius: '8px',
                                border: '1px solid #555',
                                backgroundColor: '#3a3a3a',
                                color: '#ffffff',
                                fontSize: '14px',
                                cursor: 'pointer'
                            }
                        },
                            h('option', { value: 'income' }, 'Income'),
                            h('option', { value: 'expense' }, 'Expense')
                        ),
                        h('input', {
                            type: 'number',
                            step: '0.01',
                            min: '0.01',
                            placeholder: 'Amount',
                            value: formData.amount || '',
                            onChange: (e) => setFormData({ ...formData, amount: parseFloat(e.target.value) || 0 }),
                            style: {
                                padding: '12px',
                                borderRadius: '8px',
                                border: '1px solid #555',
                                backgroundColor: '#3a3a3a',
                                color: '#ffffff',
                                fontSize: '14px'
                            },
                            required: true
                        }),
                        h('input', {
                            type: 'text',
                            placeholder: 'Description',
                            value: formData.description,
                            onChange: (e) => setFormData({ ...formData, description: e.target.value }),
                            style: {
                                padding: '12px',
                                borderRadius: '8px',
                                border: '1px solid #555',
                                backgroundColor: '#3a3a3a',
                                color: '#ffffff',
                                fontSize: '14px'
                            },
                            required: true
                        }),
                        h('button', {
                            type: 'submit',
                            disabled: loading,
                            style: {
                                padding: '12px 24px',
                                borderRadius: '8px',
                                border: 'none',
                                backgroundColor: loading ? '#666' : '#356aff',
                                color: '#ffffff',
                                fontSize: '14px',
                                fontWeight: 'bold',
                                cursor: 'pointer',
                                transition: 'background-color 0.2s'
                            }
                        }, loading ? 'Adding...' : 'Add Transaction')
                    )
                ),

                // Balance Summary
                h('div', {
                    style: {
                        display: 'grid',
                        gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))',
                        gap: '15px',
                        marginBottom: '30px'
                    }
                },
                    h('div', { style: { ...cardStyle, textAlign: 'center', padding: '15px' } },
                        h('h3', { style: { color: incomeColor, margin: '0 0 10px 0' } }, 'Total Income'),
                        h('p', { style: { fontSize: '24px', margin: 0, fontWeight: 'bold' } }, 
                            `$${summary.totalIncome.toFixed(2)}`
                        )
                    ),
                    h('div', { style: { ...cardStyle, textAlign: 'center', padding: '15px' } },
                        h('h3', { style: { color: expenseColor, margin: '0 0 10px 0' } }, 'Total Expenses'),
                        h('p', { style: { fontSize: '24px', margin: 0, fontWeight: 'bold' } }, 
                            `$${summary.totalExpenses.toFixed(2)}`
                        )
                    ),
                    h('div', { style: { ...cardStyle, textAlign: 'center', padding: '15px' } },
                        h('h3', { 
                            style: { 
                                color: summary.balance >= 0 ? incomeColor : expenseColor, 
                                margin: '0 0 10px 0' 
                            } 
                        }, 'Net Balance'),
                        h('p', { 
                            style: { 
                                fontSize: '24px', 
                                margin: 0, 
                                fontWeight: 'bold',
                                color: summary.balance >= 0 ? incomeColor : expenseColor
                            } 
                        }, `$${summary.balance.toFixed(2)}`)
                    ),
                    h('div', { style: { ...cardStyle, textAlign: 'center', padding: '15px' } },
                        h('h3', { style: { color: '#356aff', margin: '0 0 10px 0' } }, 'Total Transactions'),
                        h('p', { style: { fontSize: '24px', margin: 0, fontWeight: 'bold' } }, 
                            summary.transactionCount
                        )
                    )
                ),

                // Transaction List
                h('div', { style: cardStyle },
                    h('h2', { style: { marginBottom: '20px', color: '#356aff' } }, 'Recent Transactions'),
                    transactions.length === 0 ? 
                        h('p', { 
                            style: { 
                                textAlign: 'center', 
                                color: '#888', 
                                padding: '20px' 
                            } 
                        }, 'No transactions yet. Add your first transaction above!') :
                        h('div', { style: { display: 'grid', gap: '10px' } },
                            ...transactions.map((transaction) =>
                                h('div', {
                                    key: transaction.id,
                                    style: {
                                        ...cardStyle,
                                        display: 'flex',
                                        justifyContent: 'space-between',
                                        alignItems: 'center',
                                        padding: '15px'
                                    }
                                },
                                    h('div', { style: { display: 'flex', alignItems: 'center', gap: '15px' } },
                                        h('div', {
                                            style: {
                                                width: '10px',
                                                height: '10px',
                                                borderRadius: '50%',
                                                backgroundColor: transaction.type === 'income' ? incomeColor : expenseColor
                                            }
                                        }),
                                        h('div', {},
                                            h('div', { style: { fontWeight: 'bold', marginBottom: '5px' } },
                                                transaction.description
                                            ),
                                            h('div', { style: { fontSize: '12px', color: '#888' } },
                                                `${new Date(transaction.date).toLocaleDateString()} - ${transaction.type}`
                                            )
                                        )
                                    ),
                                    h('div', { style: { display: 'flex', alignItems: 'center', gap: '15px' } },
                                        h('span', {
                                            style: {
                                                fontSize: '18px',
                                                fontWeight: 'bold',
                                                color: transaction.type === 'income' ? incomeColor : expenseColor
                                            }
                                        }, `${transaction.type === 'income' ? '+' : '-'}$${transaction.amount.toFixed(2)}`),
                                        h('button', {
                                            onClick: () => deleteTransaction(transaction.id),
                                            disabled: loading,
                                            style: {
                                                padding: '8px 16px',
                                                borderRadius: '8px',
                                                border: 'none',
                                                backgroundColor: loading ? '#666' : expenseColor,
                                                color: '#ffffff',
                                                fontSize: '12px',
                                                fontWeight: 'bold',
                                                cursor: 'pointer'
                                            }
                                        }, 'Delete')
                                    )
                                )
                            )
                        )
                )
            );
        };

        // Render the app
        ReactDOM.render(React.createElement(FinanceTracker), document.getElementById('root'));
    </script>
</body>
</html>
